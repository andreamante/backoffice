<div style="min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 2rem;">
  <div class="card" style="max-width: 460px; width: 100%; box-shadow: var(--shadow-lg);">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <div class="brand-logo-mark" style="margin: 0 auto 0.75rem auto; width: 50px; height: 50px; font-size: 1.6rem;">V</div>
      <h2 style="color: var(--navy-dark); font-size: 1.4rem; font-weight: 800;">VALLEBRUNA FORNITURE</h2>
      <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 0.25rem;">Backoffice Gestione Magazzino & Ordini</p>
    </div>

    @if (errorMessage()) {
      <div class="alert alert-danger" style="margin-bottom: 1.25rem;">
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label class="form-label required">Email</label>
        <input
          type="email"
          class="form-control"
          placeholder="es. magazzino@vallebruna.it"
          [(ngModel)]="email"
          name="email"
          required
        />
      </div>

      <div class="form-group" style="margin-bottom: 1.5rem;">
        <label class="form-label required">Password</label>
        <input
          type="password"
          class="form-control"
          placeholder="Inserisci password"
          [(ngModel)]="password"
          name="password"
          required
        />
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.65rem;">
        Accedi al Backoffice
      </button>
    </form>

    <div style="margin-top: 2rem; padding-top: 1.25rem; border-top: 1px dashed var(--border-color);">
      <p style="font-size: 0.8rem; font-weight: 700; color: #475569; margin-bottom: 0.5rem; text-transform: uppercase;">
        Accesso Rapido Demo per Profili:
      </p>
      <div style="display: flex; flex-direction: column; gap: 0.5rem;">
        <button
          type="button"
          class="btn btn-secondary btn-sm"
          style="justify-content: space-between;"
          (click)="quickLogin('magazziniere')"
        >
          <span>📦 <strong>Magazziniere</strong> (magazzino&#64;vallebruna.it)</span>
          <span class="user-role-tag role-magazziniere">Giacenze & Movimenti</span>
        </button>

        <button
          type="button"
          class="btn btn-secondary btn-sm"
          style="justify-content: space-between;"
          (click)="quickLogin('commerciale')"
        >
          <span>💼 <strong>Commerciale</strong> (commerciale&#64;vallebruna.it)</span>
          <span class="user-role-tag role-commerciale">Prezzi & Ordini</span>
        </button>

        <button
          type="button"
          class="btn btn-secondary btn-sm"
          style="justify-content: space-between;"
          (click)="quickLogin('amministratore')"
        >
          <span>👑 <strong>Amministratore</strong> (admin&#64;vallebruna.it)</span>
          <span class="user-role-tag role-amministratore">Accesso Totale</span>
        </button>
      </div>

      <div class="alert alert-info" style="margin-top: 1rem; font-size: 0.75rem; padding: 0.6rem 0.8rem;">
        ℹ️ <em>Nota Livello 4: Senza un backend vero, il login è una simulazione memorizzata in locale.</em>
      </div>
    </div>
  </div>
</div>
